name: Container checks and images

on:
  push:
    branches: [main, codex/deployment-setup]
    paths:
      - "Dockerfile*"
      - ".dockerignore"
      - "docker-compose*.yml"
      - ".env.example"
      - "nginx/**"
      - "scripts/check_containers.py"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/containers.yml"
  pull_request:
    paths:
      - "Dockerfile*"
      - ".dockerignore"
      - "docker-compose*.yml"
      - ".env.example"
      - "nginx/**"
      - "scripts/check_containers.py"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/containers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Production, TLS and development containers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build images and exercise isolated stacks
        run: python3 scripts/check_containers.py

  publish:
    name: Publish ${{ matrix.component }}
    needs: check
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/deployment-setup')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Image name
        id: image
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish matching commit tags
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.prefix }}-${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Deployment tag
        env:
          IMAGE: ${{ steps.image.outputs.prefix }}-${{ matrix.component }}:sha-${{ github.sha }}
        run: echo "Published $IMAGE" >> "$GITHUB_STEP_SUMMARY"

  verify-published:
    name: Deploy published images without a build
    needs: publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Pull and deploy the published pair
        shell: bash
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          export IMAGE_TAG="sha-${GITHUB_SHA}"
          docker compose -f docker-compose.prod.yml pull
          python3 scripts/check_containers.py --production-only --skip-build \
            --image-prefix "$IMAGE_PREFIX" --tag "$IMAGE_TAG"
