name: Native development launcher

on:
  push:
    branches: [main]
    paths: &launcher-paths
      - "dev"
      - "dev.cmd"
      - "scripts/dev.py"
      - "scripts/check_dev.py"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/development.yml"
  pull_request:
    paths: *launcher-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Native startup and shutdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.17"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.5"
      - name: Check launcher formatting and lint
        run: |
          uv run --project backend --locked ruff check --config backend/pyproject.toml scripts/dev.py scripts/check_dev.py
          uv run --project backend --locked ruff format --check --config backend/pyproject.toml scripts/dev.py scripts/check_dev.py
      - name: Exercise startup, duplicate launch and shutdown
        run: uv run --project backend --locked python scripts/check_dev.py
