[project]
name = "aurax-backend"
version = "0.1.0"
description = "AURAx scientific API"
requires-python = ">=3.11"
dependencies = [
    "astropy>=6,<9",
    "fastapi>=0.110,<1",
    "numpy>=1.26,<3",
    "photutils>=2.3,<4",
    "pyvo>=1.5,<2",
    "reproject>=0.21,<1",
    "requests>=2.31,<3",
    "uvicorn[standard]>=0.28,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
