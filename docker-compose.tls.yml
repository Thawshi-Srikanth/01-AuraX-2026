# Optional overlay: -f docker-compose.prod.yml -f docker-compose.tls.yml
services:
  frontend:
    environment:
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/https
      NGINX_ENVSUBST_FILTER: SERVER_NAME|TLS_CERTIFICATE_FILE|TLS_CERTIFICATE_KEY|HTTPS_REDIRECT_PORT
      HTTPS_REDIRECT_PORT: ${PROD_HTTPS_PORT:-443}
      SERVER_NAME: ${SERVER_NAME:?Set the public hostname}
      TLS_CERTIFICATE_FILE: ${TLS_CERTIFICATE_FILE:?Set the certificate path inside the container}
      TLS_CERTIFICATE_KEY: ${TLS_CERTIFICATE_KEY:?Set the private key path inside the container}
    ports:
      - "${PROD_BIND_ADDRESS:-0.0.0.0}:${PROD_HTTPS_PORT:-443}:443"
    volumes:
      - ${TLS_CERTS_DIR:?Set the host certificate directory}:/etc/letsencrypt:ro
