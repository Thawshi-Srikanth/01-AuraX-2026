# Pull-only deployment: this file has no source mounts or build instructions.
name: aurax
services:
  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/thawshi-srikanth/01-aurax-2026}-backend:${IMAGE_TAG:?Set IMAGE_TAG to a verified version or sha-COMMIT tag}
    init: true
    restart: unless-stopped
    environment:
      CACHE_DB_PATH: /data/aurax.db
      FITS_CACHE_DIR: /data/fits
      FITS_CACHE_MAX_BYTES: ${FITS_CACHE_MAX_BYTES:-536870912}
      FITS_CACHE_MAX_FILE_BYTES: ${FITS_CACHE_MAX_FILE_BYTES:-134217728}
      FITS_CACHE_MAX_IDLE_SECONDS: ${FITS_CACHE_MAX_IDLE_SECONDS:-604800}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - backend-cache:/data
    stop_grace_period: 150s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '2'}

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/thawshi-srikanth/01-aurax-2026}-frontend:${IMAGE_TAG:?Set IMAGE_TAG to a verified version or sha-COMMIT tag}
    init: true
    restart: unless-stopped
    ports:
      - "${PROD_BIND_ADDRESS:-0.0.0.0}:${PROD_HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '2'}

volumes:
  backend-cache:
