# Rendered by the official Nginx entrypoint only when the TLS overlay is enabled.
server {
    listen 80;
    listen [::]:80;
    server_name ${SERVER_NAME};
    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location / { return 308 https://$host:${HTTPS_REDIRECT_PORT}$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${SERVER_NAME};
    ssl_certificate ${TLS_CERTIFICATE_FILE};
    ssl_certificate_key ${TLS_CERTIFICATE_KEY};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    include /etc/nginx/aurax/site.conf;
}
