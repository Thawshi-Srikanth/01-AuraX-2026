root /usr/share/nginx/html;
index index.html;
client_max_body_size 1m;
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }
location = /backend { return 308 /backend/; }
location /backend/ {
    include /etc/nginx/aurax/proxy.conf;
    proxy_pass http://aurax_backend/;
}
# Keep direct API routes usable for API clients and operational health checks.
location /api/ {
    include /etc/nginx/aurax/proxy.conf;
    proxy_pass http://aurax_backend;
}
location = /health {
    include /etc/nginx/aurax/proxy.conf;
    proxy_pass http://aurax_backend/health;
}
location ~* "^/assets/[^/]+-[a-z0-9_-]{8,}\.(js|css|woff2?|ttf)$" {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}
location /assets/ {
    try_files $uri =404;
    expires 1h;
}
location = /index.html {
    add_header Cache-Control "no-cache";
}
location / { try_files $uri $uri/ /index.html; }
